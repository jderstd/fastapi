version: 2
updates:
    - package-ecosystem: "uv"
      directory: "/"
      schedule:
          interval: "daily"
          time: "00:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 1
          include:
              - "*"
      commit-message:
          prefix: "chore"
      ignore:
          - dependency-name: "fastapi"
            update-types:
                - "version-update:semver-patch"
